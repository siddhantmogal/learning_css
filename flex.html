    <style>
.flex-items{
   background-color: rgb(250, 146, 18);
width: 200px;
padding: 10px;
height: 150px;
margin-top: 10px;
color: white;
font-size: 50px;
border: 3px solid red;
border-radius: 20px;

/* if we want anything in centre so we used it */
display: flex;
justify-content: center;
align-items: center;

}
.flex-container{
    display: flex;
    flex-wrap: wrap;
    flex-direction:row;
    /* space-evenly,space-between,space-around */
    justify-content: space-around;
    list-style: none;
}









</style>

    <body>
        <!--ul.flex-container>li.flex-items*10-->
        <ul class="flex-container">
            <li class="flex-items">1</li>
            <li class="flex-items">2</li>
            <li class="flex-items">3</li>
            <li class="flex-items">4</li>
            <li class="flex-items">5</li>
            <li class="flex-items">6</li>
            <li class="flex-items">7</li>
            <li class="flex-items">8</li>
            <li class="flex-items">9</li>
            <li class="flex-items">10</li>
        </ul>
    </body>
