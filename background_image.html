     <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Background Image Example</title>

    <style>
        .bg_image_example {
            background-color: black;
            background-image: url("../learning_css/images/himalaya.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;

            height: 600px;
            padding: 30px;
        }

        .bg_heading {
            padding-top: 60px;
            font-size: 60px;
            color: white;
            text-align: center;
        }

        .bg_text {
            color: white;
            text-align: center;
            font-size: 22px;
            margin-top: 20px;
        }

        .btn {
            display: block;
            margin: 30px auto;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="bg_image_example">

        <h1 class="bg_heading">
            Welcome to the Himalayas
        </h1>

        <p class="bg_text">
            Explore the beauty of nature, mountains, valleys and peaceful landscapes.
        </p>

        <p class="bg_text">
            The Himalayas are one of the most beautiful mountain ranges in the world.
        </p>

        <button class="btn">
            Explore More
        </button>

    </div>


    
</body>
</html>
