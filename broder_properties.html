<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
        /* solid,dotted,dashed,insert,outsert*/
        .b_property1{
            border: 4px solid black;
            width : 600px;

        }
        .b_property2{
            border: 4px solid grey;
            border-top-color: black ;
            border-bottom-color: black ;
            border-right-color: grey;
            border-left-color: grey;

            /* border-radius: 50px; */

            border-radius: 50px  140px 20px 100px solid blue;
            width : 400px;
        }
        .b_property3{
            border: 4px dotted grey;
            width : 400px;
        }
         .b_property4{
            border: 4px insert grey;
            width : 400px;
         }
    </style>
    </head>
    <body>
        <img src="images/annapurna.webp" class="b_property1">

        <img src="images/himalaya.jpg" class="b_property2">

        <img src="images/abc.jpg" class="b_property3">

        <img src="images/natures.jpg" class="b_property4">

    </body>
</html>
