<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!DOCTYPE html>

    <title>CSS Position</title>

    <style>
        .box {
            width: 200px;
            height: 50px;
            border: 4px solid red;
            margin-bottom: 10px;
            padding: 20px;
            background-color: aqua;
        }
        .box1 {
    position: static;
}

.box2 {
    position: relative;
    left: 70px;
}

.box3 {
    position: absolute;
    left: 300px;
    top: 20px;
}

.box4 {
    position: sticky;
    top: 10px;
}

.box5 {
    position: fixed;
    right: 10px;
    bottom: 0px;
}

    </style>
</head>

<body>

    <div class="box box1" >static</div>
    <div class="box box2" >relative</div>
    <div class="box box3"  >absolute</div>
    <div class="box box4">sticky</div>
    <div class="box box5">fixed</div>


</body>
</html>
