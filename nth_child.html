<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            width:200px;
            padding:15px;
            list-style-type:none;
            font-weight:900;

        }

       
        li{
            padding:10px;
            border:2px solid red;
            margin-bottom: 5px;
            border-radius: 10px;
        }
            /* even odd color change using nth-child
        li:nth-child(even){
            background-color:cadetblue;

        }
        li:nth-child(even){
            background-color:black;
            color:white;
        }
      */

      li:first-child{
        background-color:aqua;

      }
       li:last-child{
        background-color:blueviolet;
        
      }
      li:nth-child(4){
        background-color:brown;
      }

        
    </style>
</head>
<body>
    <!--ul>li*8{Item $}-->
   
    <ul>
        <li>Item1</li>
        <li>Item2</li>
        <li>Item3</li>
        <li>Item4</li>
        <li>Item5</li>
        <li>Item6</li>
        <li>Item7</li>
        <li>Item8</li>
    </ul>
</body>
</html>
